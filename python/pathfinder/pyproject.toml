[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder"
version = "0.1.0"
description = "Initialize grid environments and ONNX-backed agents for pathfinding."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grid-agent>=0.1.0",
    "grid-env>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["pathfinder*"]

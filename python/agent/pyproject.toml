[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-agent"
version = "0.1.0"
description = "A grid-world agent with a persistent multi-channel map and DQN inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "stable-baselines3>=2.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-grid-env"
version = "0.1.0"
description = "Gymnasium adapter for grid-env and grid-agent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grid-agent>=0.1.0",
    "grid-env>=0.1.0",
    "gymnasium>=0.29",
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
include = ["gym_grid_env*"]

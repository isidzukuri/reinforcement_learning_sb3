[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-env"
version = "0.1.0"
description = "A configurable grid environment with CSV import and export."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
png = ["Pillow>=9"]

[tool.setuptools.packages.find]
include = ["grid_env*"]
